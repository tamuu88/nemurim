<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>眠れない夜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #e8eaf0;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 400;
      margin: 30px 0 10px;
    }

    .subtitle {
      font-size: 13px;
      color: #8f96a8;
      margin-bottom: 50px;
    }

    .menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-size: 16px;
      color: #e8eaf0;
      background: #1c2434;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .back {
      align-self: flex-start;
      background: none;
      padding: 10px 0;
      color: #8f96a8;
      font-size: 14px;
    }

    .screen {
      display: none;
      width: 100%;
      flex: 1;
      flex-direction: column;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    .question-area {
      flex: 1;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .question {
      font-size: 23px;
      line-height: 1.8;
      font-weight: 400;
    }

    .next {
      width: 100%;
      margin-bottom: 30px;
    }

    .dot-area {
      position: relative;
      width: 100%;
      height: 70vh;
      min-height: 400px;
      overflow: hidden;
    }

    .dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #cbd5ff;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition:
        left 8s ease-in-out,
        top 8s ease-in-out;
    }

    .dot-help {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #6f7789;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ホーム -->
    <div id="home" class="screen active">
      <h1>眠れない夜</h1>
      <div class="subtitle">少しだけ、遊んでいこう。</div>

      <div class="menu">
        <button onclick="showQuestion()">どうでもいい質問</button>
        <button onclick="showDot()">ゆっくり動く点</button>
      </div>
    </div>


    <!-- 質問 -->
    <div id="questionScreen" class="screen">

      <button class="back" onclick="goHome()">← 戻る</button>

      <div class="question-area">
        <div id="question" class="question"></div>
      </div>

      <button class="next" onclick="newQuestion()">もう一問</button>

    </div>


    <!-- 点 -->
    <div id="dotScreen" class="screen">

      <button class="back" onclick="goHome()">← 戻る</button>

      <div class="dot-area" id="dotArea">
        <div class="dot" id="dot"></div>
        <div class="dot-help">点を押してみて</div>
      </div>

    </div>

  </div>


  <script>

    const questions = [
      "今日いちばんおいしかったものは？",
      "今、家の中でいちばん好きな場所は？",
      "子どもの頃、好きだったお菓子は？",
      "明日、晴れていたら何したい？",
      "コンビニでつい見てしまう棚は？",
      "今まで食べた中で、また食べたいものは？",
      "最近ちょっと嬉しかったことは？",
      "好きな匂いは？",
      "今、飲みたいものは？",
      "小さい頃、好きだった遊びは？",
      "もし明日休みだったら何をする？",
      "最近よく見かけるものは？",
      "好きな季節は？",
      "今の部屋で一番落ち着く場所は？",
      "最近、笑ったことは？"
    ];

    let lastQuestion = -1;


    function hideAll() {
      document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
      });
    }


    function showQuestion() {
      hideAll();
      document.getElementById("questionScreen").classList.add("active");
      newQuestion();
    }


    function newQuestion() {

      let index;

      do {
        index = Math.floor(Math.random() * questions.length);
      } while (index === lastQuestion);

      lastQuestion = index;

      document.getElementById("question").textContent =
        questions[index];
    }


    function showDot() {
      hideAll();
      document.getElementById("dotScreen").classList.add("active");

      setTimeout(moveDot, 300);
    }


    const dot = document.getElementById("dot");
    const dotArea = document.getElementById("dotArea");


    dot.addEventListener("click", moveDot);


    function moveDot() {

      const areaWidth = dotArea.clientWidth;
      const areaHeight = dotArea.clientHeight;

      const x = Math.random() * (areaWidth - 40) + 20;
      const y = Math.random() * (areaHeight - 40) + 20;

      dot.style.left = x + "px";
      dot.style.top = y + "px";
    }


    function goHome() {
      hideAll();
      document.getElementById("home").classList.add("active");
    }

  </script>

</body>
</html>
