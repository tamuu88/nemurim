<!DOCTYPE html>

<html lang="ja">

<head>
  <meta charset="UTF-8">

  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>眠れない夜</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">


<!-- ホーム -->
<div id="home" class="screen active">

  <h1>眠れない夜</h1>

  <div class="subtitle">
    少しだけ、遊んでいこう。
  </div>

  <div class="menu">

    <button onclick="showQuestion()">
      問
    </button>

    <button onclick="showShuffle()">
      考
    </button>

    <button onclick="showDot()">
      点
    </button>

    <button onclick="showCircle()">
      円
    </button>

    <button onclick="showMusic()">
      音
    </button>

  </div>

</div>


<!-- どうでもいい質問 -->
<div id="questionScreen" class="screen">

  <button class="back" onclick="goHome()">
    ← 戻る
  </button>

  <div class="question-area">
    <div id="question" class="question"></div>
  </div>

  <button class="next" onclick="newQuestion()">
    もう一問
  </button>

</div>


<!-- 認知シャッフル -->
<div id="shuffleScreen" class="screen">

  <button class="back" onclick="goHome()">
    ← 戻る
  </button>

  <div class="shuffle-area">

    <div class="shuffle-text" id="shuffleText">
      今、見えるものをひとつ思い浮かべる
    </div>

    <div class="shuffle-buttons">

      <button onclick="nextShuffle()">
        思い浮かべた
      </button>

      <button onclick="resetShuffle()">
        もう一度最初から
      </button>

    </div>

  </div>

</div>


<!-- ゆっくり動く点 -->
<div id="dotScreen" class="screen">

  <button class="back" onclick="goHome()">
    ← 戻る
  </button>

  <div class="dot-area" id="dotArea">

    <div class="dot" id="dot"></div>

    <div class="dot-help">
      点を押してみて
    </div>

  </div>

</div>


<!-- ゆっくり消える円 -->
<div id="circleScreen" class="screen">

  <button class="back" onclick="goHome()">
    ← 戻る
  </button>

  <div class="circle-area" id="circleArea">

    <div
      class="breathing-circle"
      id="breathingCircle">
    </div>

  </div>

</div>


<!-- 音 -->
<div id="musicScreen" class="screen">

  <button class="back" onclick="goHome()">
    ← 戻る
  </button>

  <div class="music-area">

    <div class="music-title">
      音
    </div>

    <div class="music-description">
      眠るときに聴きたいプレイリストを登録できます。
    </div>

    <input
      type="url"
      id="playlistUrl"
      placeholder="プレイリストのURL"
    >

    <button onclick="savePlaylist()">
      保存
    </button>

    <button
      id="openPlaylistButton"
      onclick="openPlaylist()"
      style="display: none;"
    >
      プレイリストを開く
    </button>

    <button
      id="deletePlaylistButton"
      class="delete-playlist"
      onclick="deletePlaylist()"
      style="display: none;"
    >
      登録を消す
    </button>

  </div>

</div>


  </div>

  <script src="script.js"></script>

</body>

</html>
