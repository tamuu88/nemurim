<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>眠れない夜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #e8eaf0;
      font-family: sans-serif;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .screen {
      display: none;
      min-height: calc(100vh - 80px);
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 400;
      margin: 30px 0 10px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #8f96a8;
      margin-bottom: 50px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-size: 16px;
      color: #e8eaf0;
      background: #1c2434;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    .menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .back {
      align-self: flex-start;
      background: none;
      padding: 10px 0;
      color: #8f96a8;
      font-size: 14px;
    }

    /* 質問 */

    .question-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .question {
      font-size: 23px;
      line-height: 1.8;
      font-weight: 400;
    }

    .next {
      width: 100%;
      margin-bottom: 30px;
    }

    /* 点 */

    .dot-area {
      position: relative;
      flex: 1;
      min-height: 400px;
      overflow: hidden;
      touch-action: manipulation;
    }

    /*
      残光を描くキャンバス
    */
    #trailCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .dot {
      position: absolute;

      width: 18px;
      height: 18px;

      border-radius: 50%;

      background: #cbd5ff;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      /*
        最初は少し速く、
        最後にふわっと減速
      */
      transition:
        left 2.5s cubic-bezier(0.15, 0.8, 0.25, 1),
        top 2.5s cubic-bezier(0.15, 0.8, 0.25, 1);

      z-index: 2;
    }

    .dot-help {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #6f7789;
      font-size: 12px;
      pointer-events: none;
      z-index: 3;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- ホーム -->

    <div id="home" class="screen active">

      <h1>眠れない夜</h1>

      <div class="subtitle">
        少しだけ、遊んでいこう。
      </div>

      <div class="menu">

        <button onclick="showQuestion()">
          どうでもいい質問
        </button>

        <button onclick="showDot()">
          ゆっくり動く点
        </button>

      </div>

    </div>


    <!-- 質問 -->

    <div id="questionScreen" class="screen">

      <button class="back" onclick="goHome()">
        ← 戻る
      </button>

      <div class="question-area">

        <div id="question" class="question"></div>

      </div>

      <button class="next" onclick="newQuestion()">
        もう一問
      </button>

    </div>


    <!-- 点 -->

    <div id="dotScreen" class="screen">

      <button class="back" onclick="goHome()">
        ← 戻る
      </button>

      <div class="dot-area" id="dotArea">

        <canvas id="trailCanvas"></canvas>

        <div class="dot" id="dot"></div>

        <div class="dot-help">
          点を押してみて
        </div>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       どうでもいい質問
    ========================= */

    const questions = [

      "今、右手に何がある？",

      "冷蔵庫を開けたら最初に目に入るものは？",

      "家の中で一番丸いものは？",

      "今履いているものの色は？",

      "今日見た中で一番小さいものは？",

      "家の中で一番高いところにあるものは？",

      "今いちばん近くにある四角いものは？",

      "今日、何回くらい冷蔵庫を開けた？",

      "今の部屋にある「なんでここにあるんだろう」というものは？",

      "家の中で一番古そうなものは？",

      "今見える範囲にある文字をひとつ探してみて",

      "今日一番どうでもよかった出来事は？",

      "今の部屋で一番静かな場所は？",

      "いま食べてもいいなら何を食べる？",

      "「たぬき」と聞いて最初に思い浮かんだものは？",

      "今、布団の中で足の指は何本伸びてる？",

      "冷蔵庫の中で一番存在感がないものは？",

      "今、一番近くにある青いものは？",

      "今日いちばん長く見ていたものは？",

      "今いる場所で、一番古そうな音は？"

    ];

    let lastQuestion = -1;


    function showQuestion() {

      hideAll();

      document
        .getElementById("questionScreen")
        .classList.add("active");

      newQuestion();
    }


    function newQuestion() {

      let index;

      do {

        index =
          Math.floor(
            Math.random() * questions.length
          );

      } while (
        index === lastQuestion &&
        questions.length > 1
      );

      lastQuestion = index;

      document
        .getElementById("question")
        .textContent = questions[index];
    }


    /* =========================
       点
    ========================= */

    const dot =
      document.getElementById("dot");

    const dotArea =
      document.getElementById("dotArea");

    const canvas =
      document.getElementById("trailCanvas");

    const ctx =
      canvas.getContext("2d");


    function resizeCanvas() {

      const rect =
        dotArea.getBoundingClientRect();

      const dpr =
        window.devicePixelRatio || 1;

      canvas.width =
        rect.width * dpr;

      canvas.height =
        rect.height * dpr;

      canvas.style.width =
        rect.width + "px";

      canvas.style.height =
        rect.height + "px";

      ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
      );
    }


    function showDot() {

      hideAll();

      document
        .getElementById("dotScreen")
        .classList.add("active");

      setTimeout(() => {

        resizeCanvas();

        const width =
          dotArea.clientWidth;

        const height =
          dotArea.clientHeight;

        dot.style.left =
          (width / 2) + "px";

        dot.style.top =
          (height / 2) + "px";

      }, 50);
    }


    /*
      点を押したら移動
    */

    dot.addEventListener(
      "click",
      moveDot
    );


    function moveDot() {

      const width =
        dotArea.clientWidth;

      const height =
        dotArea.clientHeight;

      const margin = 30;

      /*
        今いる位置
      */

      const startX =
        parseFloat(dot.style.left) ||
        width / 2;

      const startY =
        parseFloat(dot.style.top) ||
        height / 2;


      /*
        新しい場所
      */

      const endX =
        Math.random() *
        (width - margin * 2) +
        margin;

      const endY =
        Math.random() *
        (height - margin * 2) +
        margin;


      /*
        通り道を光らせる
      */

      drawTrail(
        startX,
        startY,
        endX,
        endY
      );


      /*
        点を移動
      */

      dot.style.left =
        endX + "px";

      dot.style.top =
        endY + "px";
    }


    /*
      残光を描く
    */

    function drawTrail(
      startX,
      startY,
      endX,
      endY
    ) {

      resizeCanvas();

      /*
        以前の光を消す
      */

      ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
      );


      /*
        少しだけ曲げる
      */

      const middleX =
        (startX + endX) / 2 +
        (Math.random() - 0.5) * 80;

      const middleY =
        (startY + endY) / 2 +
        (Math.random() - 0.5) * 80;


      /*
        淡い光
      */

      ctx.beginPath();

      ctx.moveTo(
        startX,
        startY
      );

      ctx.quadraticCurveTo(
        middleX,
        middleY,
        endX,
        endY
      );


      /*
        ほんのり光る線
      */

      ctx.strokeStyle =
        "rgba(203, 213, 255, 0.16)";

      ctx.lineWidth = 7;

      ctx.lineCap = "round";

      ctx.shadowBlur = 12;

      ctx.shadowColor =
        "rgba(203, 213, 255, 0.18)";

      ctx.stroke();


      /*
        数秒かけて消す
      */

      setTimeout(
        fadeTrail,
        100
      );
    }


    function fadeTrail() {

      let opacity = 1;

      const fade =
        setInterval(() => {

          opacity -= 0.035;

          ctx.fillStyle =
            "rgba(16, 21, 34, 0.035)";

          ctx.fillRect(
            0,
            0,
            canvas.clientWidth,
            canvas.clientHeight
          );

          if (opacity <= 0) {

            clearInterval(fade);

            ctx.clearRect(
              0,
              0,
              canvas.clientWidth,
              canvas.clientHeight
            );
          }

        }, 80);
    }


    /* =========================
       画面切り替え
    ========================= */

    function hideAll() {

      document
        .querySelectorAll(".screen")
        .forEach(screen => {

          screen.classList.remove(
            "active"
          );

        });
    }


    function goHome() {

      hideAll();

      document
        .getElementById("home")
        .classList.add("active");
    }


    window.addEventListener(
      "resize",
      resizeCanvas
    );

  </script>

</body>
</html>
