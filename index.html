<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>眠れない夜</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101522;
      color: #e8eaf0;
      font-family: sans-serif;
    }

    .app {
      width: 100%;
      max-width: 500px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* 共通 */
    .screen {
      display: none;
      min-height: calc(100vh - 80px);
      flex-direction: column;
    }

    .screen.active {
      display: flex;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 400;
      margin: 30px 0 10px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #8f96a8;
      margin-bottom: 50px;
    }

    button {
      border: none;
      border-radius: 18px;
      padding: 20px;
      font-size: 16px;
      color: #e8eaf0;
      background: #1c2434;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.98);
    }

    /* ホーム */
    .menu {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 戻る */
    .back {
      align-self: flex-start;
      background: none;
      padding: 10px 0;
      color: #8f96a8;
      font-size: 14px;
    }

    /* 質問 */
    .question-area {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .question {
      font-size: 23px;
      line-height: 1.8;
      font-weight: 400;
    }

    .next {
      width: 100%;
      margin-bottom: 30px;
    }

    /* 点 */
    .dot-area {
      position: relative;
      flex: 1;
      min-height: 400px;
      overflow: hidden;
      touch-action: manipulation;
    }

    .dot {
      position: absolute;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #cbd5ff;

      left: 0;
      top: 0;

      transition:
        left 2.5s cubic-bezier(0.15, 0.8, 0.25, 1),
        top 2.5s cubic-bezier(0.15, 0.8, 0.25, 1);

      transform: translate(-50%, -50%);
    }

    .dot-help {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      color: #6f7789;
      font-size: 12px;
      pointer-events: none;
    }


    /* =========================
       ゆっくり消える円
    ========================= */

    .circle-area {
      position: relative;
      flex: 1;
      min-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: manipulation;
    }

    .breathing-circle {
      width: 150px;
      height: 150px;
      border-radius: 50%;

      border: 1px solid rgba(203, 213, 255, 0.5);

      box-shadow:
        0 0 25px rgba(203, 213, 255, 0.15);

      opacity: 0.9;

      transition:
        opacity 6s ease-out,
        box-shadow 6s ease-out;
    }

  </style>
</head>

<body>

  <div class="app">

    <!-- ホーム -->
    <div id="home" class="screen active">

      <h1>眠れない夜</h1>

      <div class="subtitle">
        少しだけ、遊んでいこう。
      </div>

      <div class="menu">

        <button onclick="showQuestion()">
          どうでもいい質問
        </button>

        <button onclick="showDot()">
          ゆっくり動く点
        </button>

        <button onclick="showCircle()">
          ゆっくり消える円
        </button>

      </div>

    </div>


    <!-- どうでもいい質問 -->
    <div id="questionScreen" class="screen">

      <button class="back" onclick="goHome()">
        ← 戻る
      </button>

      <div class="question-area">
        <div id="question" class="question"></div>
      </div>

      <button class="next" onclick="newQuestion()">
        もう一問
      </button>

    </div>


    <!-- ゆっくり動く点 -->
    <div id="dotScreen" class="screen">

      <button class="back" onclick="goHome()">
        ← 戻る
      </button>

      <div class="dot-area" id="dotArea">

        <div class="dot" id="dot"></div>

        <div class="dot-help">
          点を押してみて
        </div>

      </div>

    </div>


    <!-- ゆっくり消える円 -->
    <div id="circleScreen" class="screen">

      <button class="back" onclick="goHome()">
        ← 戻る
      </button>

      <div class="circle-area" id="circleArea">

        <div
          class="breathing-circle"
          id="breathingCircle">
        </div>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       どうでもいい質問
    ========================= */

    const questions = [
      "今日いちばんおいしかったものは？",
      "今、家の中でいちばん好きな場所は？",
      "子どもの頃、好きだったお菓子は？",
      "明日、晴れていたら何したい？",
      "コンビニでつい見てしまう棚は？",
      "今まで食べた中で、また食べたいものは？",
      "最近ちょっと嬉しかったことは？",
      "好きな匂いは？",
      "今、飲みたいものは？",
      "小さい頃、好きだった遊びは？",
      "もし明日休みだったら何をする？",
      "最近よく見かけるものは？",
      "好きな季節は？",
      "今の部屋で一番落ち着く場所は？",
      "最近、笑ったことは？"
    ];

    let lastQuestion = -1;


    function showQuestion() {

      hideAll();

      document
        .getElementById("questionScreen")
        .classList.add("active");

      newQuestion();
    }


    function newQuestion() {

      let index;

      do {
        index = Math.floor(
          Math.random() * questions.length
        );
      } while (
        index === lastQuestion &&
        questions.length > 1
      );

      lastQuestion = index;

      document
        .getElementById("question")
        .textContent = questions[index];
    }


    /* =========================
       ゆっくり動く点
    ========================= */

    const dot = document.getElementById("dot");
    const dotArea = document.getElementById("dotArea");


    function showDot() {

      hideAll();

      document
        .getElementById("dotScreen")
        .classList.add("active");

      setTimeout(() => {

        const width = dotArea.clientWidth;
        const height = dotArea.clientHeight;

        dot.style.left = (width / 2) + "px";
        dot.style.top = (height / 2) + "px";

      }, 50);
    }


    dot.addEventListener("click", moveDot);


    function moveDot() {

      const width = dotArea.clientWidth;
      const height = dotArea.clientHeight;

      const margin = 30;

      const x =
        Math.random() *
        (width - margin * 2) +
        margin;

      const y =
        Math.random() *
        (height - margin * 2) +
        margin;

      dot.style.left = x + "px";
      dot.style.top = y + "px";
    }


    /* =========================
       ゆっくり消える円
    ========================= */

    const breathingCircle =
      document.getElementById("breathingCircle");

    const circleArea =
      document.getElementById("circleArea");


    function showCircle() {

      hideAll();

      document
        .getElementById("circleScreen")
        .classList.add("active");

      startCircle();
    }


    let circleTimer;

function startCircle() {

  clearTimeout(circleTimer);

  // いったん明るくする
  breathingCircle.style.transition = "none";

  breathingCircle.style.opacity = "1";

  breathingCircle.style.boxShadow =
    "0 0 30px rgba(203, 213, 255, 0.25)";

  // 少し待ってから、ゆっくり暗くする
  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      breathingCircle.style.transition =
        "opacity 6s ease-out, box-shadow 6s ease-out";

      breathingCircle.style.opacity = "0.08";

      breathingCircle.style.boxShadow =
        "0 0 4px rgba(203, 213, 255, 0.03)";

    });

  });
}

    /*
      画面のどこをタップしても
      また明るくする
    */

    circleArea.addEventListener(
      "click",
      startCircle
    );


    /* =========================
       画面切り替え
    ========================= */

    function hideAll() {

      document
        .querySelectorAll(".screen")
        .forEach(screen => {
          screen.classList.remove("active");
        });
    }


    function goHome() {

      hideAll();

      document
        .getElementById("home")
        .classList.add("active");
    }

  </script>

</body>
</html>
